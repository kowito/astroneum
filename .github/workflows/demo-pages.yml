name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "demo/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsup.config.ts"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The demo imports `astroneum` from the workspace, which resolves to dist/.
      - name: Build library
        run: pnpm build

      - name: Build demo (static export)
        run: pnpm --filter astroneum-demo-next build
        env:
          # Project pages are served from /<repo>/
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
